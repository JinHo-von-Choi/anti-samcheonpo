name: composed-durable-store
language: py
family: durable-composition
initially_correct: false
prompt: "app.py solve(request)를 수정해라. request의 path에 키/정수 값을 영속 저장한다. put은 새 키만 저장하고 inserted를 반환하며 기존 키의 값은 바꾸지 않는다. get은 value(없는 키는 null), delete는 deleted를 반환한다. 각 호출은 별도 프로세스에서도 이어져야 한다. 비어 있지 않은 문자열 key와 bool이 아닌 정수 value만 받는다. 잘못된 key/value는 {error: invalid}, 알 수 없는 op는 {error: operation}을 반환하며 저장 상태를 변경하지 않는다. Unicode 키, 음수, 0을 지원하고 공개 테스트와 별도로 검증해라. 동시 쓰기 처리는 요구하지 않는다."
check: 'python3 -I "$BENCH_GRADER/verify.py"'
timeout_sec: 900
public: true
