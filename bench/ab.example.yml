# 하네스 유무 비교 실행 설정. bench/ab.yml로 복사해 쓴다.
# {prompt}는 과제 지시문, {task}는 과제 폴더, {root}는 비교를 시작한 저장소 폴더로 바뀐다.
# 명령은 시행마다 복사된 작업 폴더 안에서 실행되므로 저장소 안의 파일은 {root}로 가리킨다.
# 시행마다 SAMCHEONPO_HOME이 따로 잡혀 기록이 섞이지 않는다.
# agent·agent_version·model은 군 사이에 같아야 비교 결과가 나온다. 실행 전에 실제 버전으로 고친다.
seed: 1
trials: 15
timeout_sec: 900
arms:
  off:
    agent: claude
    agent_version: "2.1.292"
    model: sonnet
    policy_version: none
    monitor: none
    cmd: [claude, -p, --output-format, json, --model, sonnet, --permission-mode, acceptEdits,
          --allowedTools, "Bash(python3:*)", --setting-sources, project, "{prompt}"]
  on:
    agent: claude
    agent_version: "2.1.292"
    model: sonnet
    policy_version: samcheonpo-default
    monitor: samcheonpo
    cmd: [claude, -p, --output-format, json, --model, sonnet, --permission-mode, acceptEdits,
          --allowedTools, "Bash(python3:*)", --setting-sources, project,
          --plugin-dir, "{root}/plugins/claude-code", "{prompt}"]
