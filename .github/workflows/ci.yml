name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal plugins)"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...
      - name: bench
        run: go run ./cmd/samcheonpo bench
      - name: conformance
        run: |
          go build -o "$RUNNER_TEMP/samcheonpo" ./cmd/samcheonpo
          go run ./cmd/samcheonpo-conformance --impl "$RUNNER_TEMP/samcheonpo spec run" --task-impl "$RUNNER_TEMP/samcheonpo spec task"
      - name: hook latency regression
        # the hosted runner's process start time varies with load, so only the
        # daemon's own handling span is a regression gate here
        run: sh scripts/check-hook-budget.sh --p95-max 0 --handling-p95-max 6ms

  # The daemon, hooks, checkpoints and rollback are Unix code paths shared with
  # Linux; this job proves they also build and pass on macOS.
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: conformance
        run: |
          go build -o "$RUNNER_TEMP/samcheonpo" ./cmd/samcheonpo
          go run ./cmd/samcheonpo-conformance --impl "$RUNNER_TEMP/samcheonpo spec run" --task-impl "$RUNNER_TEMP/samcheonpo spec task"
      - name: hook latency
        run: sh scripts/check-hook-budget.sh --p95-max 0 --handling-p95-max 6ms

  # Windows: the whole suite, the conformance cases and the hook budget run on
  # x64 and arm64 runners. Commands run in Git Bash, the shell the harness
  # uses for checks on Windows.
  windows:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: python3 name for Windows
        run: |
          py=$(command -v python)
          cp "$py" "$(dirname "$py")/python3.exe"
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal plugins)"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: conformance
        run: sh scripts/check-conformance.sh
      - name: hook latency
        # the hosted runner's process start time varies with load, so only the
        # daemon's own handling span is a regression gate here
        run: sh scripts/check-hook-budget.sh --p95-max 0 --handling-p95-max 6ms
