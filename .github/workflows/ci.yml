name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal plugins)"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...
      - name: bench
        run: go run ./cmd/samcheonpo bench
      - name: conformance
        run: |
          go build -o "$RUNNER_TEMP/samcheonpo" ./cmd/samcheonpo
          go run ./cmd/samcheonpo-conformance --impl "$RUNNER_TEMP/samcheonpo spec run" --task-impl "$RUNNER_TEMP/samcheonpo spec task"
